name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_data.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun
          key: ${{ runner.os }}-bun-dependencies-${{ hashFiles('**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-dependencies

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run build:reverse-geocoding-data
      - run: bun run build:climbing-data-gen

      - name: Check if data changed
        id: check_data
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_VER=$(bun -e "console.log(JSON.parse(await Bun.file('packages/climbing-data-gen/build/world/data-version.json').text()).version)")
          LIVE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/world/data-version.json"
          LIVE_VER=$(curl -fsSL "$LIVE_URL" | bun -e "console.log(JSON.parse(await Bun.stdin.text()).version)" 2>/dev/null || echo "")
          echo "New data version: $NEW_VER"
          echo "Live data version: $LIVE_VER"
          if [ "$NEW_VER" != "$LIVE_VER" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checks and tests
        if: steps.check_data.outputs.should_deploy == 'true'
        run: |
          bun run check
          cd packages/app && bun run test --run
          cd ../holy-grade && bun test
          cd ../common && bun test

      - name: Build static site
        if: steps.check_data.outputs.should_deploy == 'true'
        run: bun run build

      - name: Verify deployment contents
        if: steps.check_data.outputs.should_deploy == 'true'
        run: |
          test -s packages/app/build/world.html
          test -s packages/app/build/grade-comparison.html
          test -s packages/app/build/edit-map.html
          test -s packages/app/build/api/world/data.json
          for continent in africa americas asia europe oceania; do
            test -f "packages/app/build/api/world/$continent/data.json"
          done

      - name: Upload Artifacts
        if: steps.check_data.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static options
          path: "packages/app/build/"

  deploy:
    needs: build_site
    if: needs.build_site.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
